services:
  api-server:
    build:
      context: .
      dockerfile: Dockerfile.api
    environment:
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in your environment or .env file}
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/health"]
      interval: 5s
      retries: 5
    networks:
      - test-network

  api-tester:
    build:
      context: .
      dockerfile: Dockerfile.newman
    depends_on:
      api-server:
        condition: service_healthy
    volumes:
      - ./tests:/etc/newman
      - ./reports/allure-results:/app/reports/allure-results
    networks:
      - test-network
    entrypoint:
      - sh
      - -c
      - |
        status=0
        mkdir -p /app/reports/allure-results
        find /app/reports/allure-results -mindepth 1 -maxdepth 1 -exec rm -rf {} \;

        echo '--- Run all non-DDT tests ---'
        if newman run /etc/newman/postman_collection.json \
          -e /etc/newman/postman_environment.json \
          --folder "POST - Sign Up (Positive)" \
          --folder "POST - Sign Up (Negative - Duplicate User)" \
          --folder "POST - Login (Positive)" \
          --folder "POST - Login (Negative - Invalid Password)" \
          --folder "GET - Get All Products (Positive)" \
          --folder "POST - Create Order (Positive)" \
          --folder "GET - Retrieve My Orders (Positive)" \
          --folder "GET - Retrieve Single Order (Positive)" \
          --folder "GET - Retrieve Single Order (Negative - Order Not Found)" \
          --folder "PUT - Update Order Quantity (Positive)" \
          --folder "DELETE - Cancel Order (Positive)" \
          --env-var "base_url=http://api-server:3000" \
          -r cli,allure \
          --reporter-allure-export /app/reports/allure-results
        then
          echo 'Non-DDT tests passed'
        else
          result=$$?
          echo "Non-DDT tests failed with exit code $$result"
          status=1
        fi

        echo '--- Run sign-up DDT suite ---'
        if newman run /etc/newman/postman_collection.json \
          -e /etc/newman/postman_environment.json \
          -d /etc/newman/data/signup_invalid_data.json \
          --folder "POST - Sign Up (Negative - Data Driven)" \
          --env-var "base_url=http://api-server:3000" \
          -r cli,allure \
          --reporter-allure-export /app/reports/allure-results
        then
          echo 'Sign-up DDT suite passed'
        else
          result=$$?
          echo "Sign-up DDT suite failed with exit code $$result"
          status=1
        fi

        echo '--- Run order-create DDT suite ---'
        if newman run /etc/newman/postman_collection.json \
          -e /etc/newman/postman_environment.json \
          -d /etc/newman/data/order_create_invalid_data.json \
          --folder "POST - Sign Up (Positive)" \
          --folder "POST - Login (Positive)" \
          --folder "POST - Create Order (Negative - Data Driven)" \
          --env-var "base_url=http://api-server:3000" \
          -r cli,allure \
          --reporter-allure-export /app/reports/allure-results
        then
          echo 'Order-create DDT suite passed'
        else
          result=$$?
          echo "Order-create DDT suite failed with exit code $$result"
          status=1
        fi

        echo '--- Run order-update DDT suite ---'
        if newman run /etc/newman/postman_collection.json \
          -e /etc/newman/postman_environment.json \
          -d /etc/newman/data/order_update_invalid_data.json \
          --folder "POST - Sign Up (Positive)" \
          --folder "POST - Login (Positive)" \
          --folder "GET - Get All Products (Positive)" \
          --folder "POST - Create Order (Positive)" \
          --folder "PUT - Update Order (Negative - Data Driven)" \
          --folder "DELETE - Cancel Order (Positive)" \
          --env-var "base_url=http://api-server:3000" \
          -r cli,allure \
          --reporter-allure-export /app/reports/allure-results
        then
          echo 'Order-update DDT suite passed'
        else
          result=$$?
          echo "Order-update DDT suite failed with exit code $$result"
          status=1
        fi

        echo '--- Test results ---'
        ls -la /app/reports/allure-results
        sync
        exit "$$status"

networks:
  test-network:
    driver: bridge